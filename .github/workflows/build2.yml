name: Build IPA (no checkout action)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Report environment
        run: |
          sw_vers
          xcodebuild -version
          git --version

      - name: Clone with git
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src
          cd src
          git log --oneline -1

      - name: Restore native device console
        id: gxconsole-cache
        uses: actions/cache@v4
        with:
          path: src/Native/DeviceConsole/build/GXDeviceConsole.xcframework
          key: gxconsole-${{ runner.os }}-v1

      - name: Build native device console
        if: steps.gxconsole-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          command -v nasm >/dev/null || brew install nasm
          command -v cmake >/dev/null || brew install cmake
          cd src/Native/DeviceConsole
          chmod +x build-xcframework.sh
          ./build-xcframework.sh

      - name: Build IPA
        run: |
          cd src
          chmod +x .github/scripts/build-ipa.sh
          export BUILD_DATE="$(date -u +%F)"
          .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: List output
        run: ls -lh "$RUNNER_TEMP/ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltX-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
