name: Build IPA (no checkout action)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Report environment
        run: |
          sw_vers
          xcodebuild -version
          git --version

      - name: Clone with git
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src
          cd src
          git log --oneline -1

      - name: Build IPA
        run: |
          cd src
          chmod +x .github/scripts/build-ipa.sh
          export BUILD_DATE="$(date -u +%F)"
          .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: List output
        run: ls -lh "$RUNNER_TEMP/ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltX-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
